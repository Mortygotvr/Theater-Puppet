[package]
name = "theater-puppet-sender"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

# Theater Puppet Sender: on the computer you play on, sends its keyboard,
# mouse and controller to Theater Puppet on the OBS computer (Puppet's
# src/tracking/network.rs). Linux: read from the kernel's input devices
# (evdev). Windows: Puppet's own readers.

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = "0.24"

[target.'cfg(windows)'.dependencies]
theater_puppet = { path = ".." }

[profile.release]
strip = true
